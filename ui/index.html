<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Matte</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Title bar / drag region -->
  <header id="titlebar">
    <div class="brand">
      <svg viewBox="0 0 24 24" class="logo" aria-hidden="true">
        <defs>
          <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#9aa7ff"/><stop offset="1" stop-color="#5b6ee8"/>
          </linearGradient>
        </defs>
        <circle cx="12" cy="12" r="10" fill="none" stroke="url(#g1)" stroke-width="2.4"/>
        <path d="M12 4a8 8 0 0 1 0 16" fill="url(#g1)"/>
      </svg>
      <span>MATTE</span>
    </div>

    <nav id="tabs"></nav>

    <button id="newtab" class="icon-btn" title="New tab (Ctrl+T)">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>

    <div class="win-controls">
      <button id="btn-min" title="Minimize">&#x2500;</button>
      <button id="btn-max" title="Maximize">&#x25A1;</button>
      <button id="btn-close" title="Close">&#x2715;</button>
    </div>
  </header>

  <!-- Toolbar -->
  <div id="toolbar">
    <div class="nav-group">
      <button id="back" class="icon-btn nav" title="Back">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="forward" class="icon-btn nav" title="Forward">
        <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="reload" class="icon-btn nav" title="Reload (Ctrl+R)">
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div id="urlbox">
      <span id="lockicon">
        <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2" fill="currentColor"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </span>
      <input id="omnibox" type="text" spellcheck="false" placeholder="Search or enter address" autocomplete="off" />
    </div>
  </div>

  <div id="progressbar"><div id="progressfill"></div></div>

  <!-- Content -->
  <main id="content"></main>

  <div id="statusbar" hidden></div>

  <script src="app.js"></script>
</body>
</html>
