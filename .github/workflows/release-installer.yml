name: Build Windows installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to build and attach an installer to
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag_name || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate lockfile for this source snapshot
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Build Windows NSIS installer without automatic publishing
        run: npm run dist -- --publish never

      - name: Attach installer to the existing GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag_name }}
          files: dist/*.exe
          overwrite_files: true
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Also keep a workflow artifact for troubleshooting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Matte-Setup-1.2.2
          path: dist/*.exe
          if-no-files-found: warn
